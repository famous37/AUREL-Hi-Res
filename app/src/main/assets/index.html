<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c0c10"><title>AUREL Hi-Res</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="murglar.css"></head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="logo"><span class="mark">a<span>.</span></span><div>AUREL <small>LOSSLESS PLAYER</small></div></div>
  <div class="side-group">EXPLORE</div>
  <button class="nav active" data-nav="home"><b>◉</b> Discover</button>
  <button class="nav" data-nav="magazine"><b>▤</b> Magazine</button>
  <button class="nav" data-nav="library"><b>▦</b> Library</button>

 </aside>
 <main class="main">

 <nav class="bottom-nav">

  <button data-nav="magazine"><span>▤</span>Magazine</button>

 </nav>
 <div id="mini" class="mini hidden" role="button" aria-label="Open player"></div>
 <div id="overlay" class="overlay hidden"></div>
 <div id="toast" class="toast hidden" role="status"></div>
</div>
<script src="app.js"></script><script src="modern.js"></script><script src="murglar.js"></script></body></html>
