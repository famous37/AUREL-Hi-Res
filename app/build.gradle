plugins { id 'com.android.application' }

android {
    namespace 'com.aurel.hires'
    compileSdk 35
    defaultConfig {
        applicationId (project.hasProperty('aurelPreview') ? 'com.aurel.hires.preview' : 'com.aurel.hires')
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName (project.hasProperty('aurelPreview') ? '1.1.9-preview' : '1.1.9')
        resValue 'string', 'aurel_app_name', (project.hasProperty('aurelPreview') ? 'AUREL Preview' : 'AUREL Hi-Res')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
