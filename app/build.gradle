plugins { id 'com.android.application' }

android {
    namespace 'com.aurel.hires'
    compileSdk 35
    defaultConfig {
        applicationId project.hasProperty('aurelPreview') ? 'com.aurel.hires.preview' : 'com.aurel.hires'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName project.hasProperty('aurelPreview') ? '1.0.8-beta-preview' : '1.0.8-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
