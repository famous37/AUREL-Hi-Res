name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, fix/off-native-usb-isolation, fix/header-overflow-spinner-animation-1-1-54, fix/consistent-control-sizes-1-1-55, fix/visual-consistency-audit-1-1-56, fix/landscape-layout-preserve-portrait-1-1-57, fix/landscape-nav-clipping-motion-1-1-58, fix/album-cover-pulse-visible-1.1.60, fix/music-synced-cover-v1.1.61, fix/fft-capture-diagnostics-v1.1.62, feature/app-error-log-fluid-transitions-v1.1.63, fix/actionable-webview-error-report-v1.1.64, feature/iridescent-aurora-glow-v1.1.65, fix/album-palette-beat-glow-v1.1.66, design/borderless-album-player-v1.1.67, design/unified-borderless-global-v1.1.68]
  pull_request:
    branches: [main, feature/cover-rhythm-v1.1.58]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Early UI design, album palette and layout preflight
        run: |
          set -euo pipefail
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node tests/borderless-player.test.cjs
          node tests/universal-borderless-theme.test.cjs
          node tests/aurora-glow.test.cjs
          node tests/aurora-glow-runtime.test.cjs
          node tests/landscape-layout.test.cjs
          node tests/landscape-nav-safe.test.cjs
          node test_ui.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile Android media player and system mixer
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace
      - name: Validate all player scripts
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Verify optional beat-reactive cover and bit-perfect audio isolation
        run: node tests/cover-rhythm.test.cjs
      - name: Simulate live FFT frames, pause, and permission control in WebView
        run: node tests/cover-rhythm-runtime.test.cjs
      - name: Verify music-transient FFT energy detector
        run: |
          mkdir -p build/beat-check
          javac -d build/beat-check app/src/main/java/com/aurel/hires/AurelBeatEnvelope.java tests/AurelBeatEnvelopeTest.java
          java -cp build/beat-check com.aurel.hires.AurelBeatEnvelopeTest
      - name: Verify iridescent artwork shadows and audio isolation
        run: node tests/aurora-glow.test.cjs
      - name: Simulate color shimmer, bit-perfect, FFT brightness and reduced-motion
        run: node tests/aurora-glow-runtime.test.cjs
      - name: Verify private global application error log and redaction
        run: node tests/error-log.test.cjs
      - name: Verify compositor-only window open and close transitions
        run: node tests/fluid-windows.test.cjs
      - name: Verify player UI and source metadata
        run: node test_ui.cjs
      - name: Regression-test account switching and Ukrainian translations
        run: node tests/account-language.test.cjs
      - name: Validate Qobuz favourites toggle and graphite theme
        run: node tests/favourites-theme.test.cjs
      - name: Verify public Qobuz sharing and Android chooser
        run: node tests/share.test.cjs
      - name: Verify smooth navigation and player stability
        run: node tests/smooth-motion.test.cjs
      - name: Verify pre-release track restrictions and published singles
        run: node tests/release-availability.test.cjs
      - name: Regression-test navigation and artwork loading
        run: node tests/navigation.test.cjs
      - name: Verify icon-only player, accessible controls and navigation hooks
        run: node tests/minimal-player.test.cjs
      - name: Verify Android 14 platform bit-perfect mixer negotiation
        run: node tests/bit-perfect.test.cjs
      - name: Verify Android-only volume and stable progress
        run: node tests/usb-volume-recovery.test.cjs
      - name: Verify Android bit-perfect capability and normal output isolation
        run: node tests/usb-bitperfect-recovery.test.cjs
      - name: Verify playback, history, USB diagnosis and update continuity
        run: node tests/playback-continuity.test.cjs
      - name: Verify swipe-down minimization and high-contrast SVG controls
        run: node tests/swipe-icons.test.cjs
      - name: Verify restored icon and precise seek gesture regression
        run: node tests/player-icon-seek.test.cjs
      - name: Verify uniform bold SVG player buttons and loading spinner states
        run: node tests/ui-bold-loading.test.cjs
      - name: Verify Share icon cascade and responsive real button sizes
        run: node tests/ui-visual-consistency.test.cjs
      - name: Verify isolated landscape grid without portrait regressions
        run: node tests/landscape-layout.test.cjs
      - name: Verify bottom navigation fits landscape and smooth motion is paint only
        run: node tests/landscape-nav-safe.test.cjs
      - name: Verify global typography, vector icons and motion invariants
        run: node tests/global-polish.test.cjs
      - name: Verify vector action buttons, search and quicklinks
        run: node tests/precise-ui.test.cjs
      - name: Verify page buffer isolation, DAC diagnostics, launcher and motion
        run: node tests/pro-audio-page-cache.test.cjs
      - name: Verify Bluetooth routing facts and categorized settings
        run: node tests/bluetooth-settings.test.cjs
      - name: Verify concise UI and vector launcher
        run: node tests/clarity-uk-icon.test.cjs
      - name: Verify full media metadata and monochrome player design
        run: node tests/media-ui-unification.test.cjs
      - name: Validate contrast and Ukrainian audio settings
        run: node tests/settings-contrast-uk.test.cjs
      - name: Verify Qobuz artist information sheet and neutral colours
        run: node tests/artist-biography-mono.test.cjs
      - name: Verify persistent settings, stale session ordering and jerk-free navigation
        run: node tests/settings-state-motion.test.cjs
      - name: Verify audio focus and player scroll boundaries
        run: node tests/player-scroll-focus.test.cjs
      - name: Verify focus interruption and resume policy
        run: |
          mkdir -p build/audio-focus-test
          javac -d build/audio-focus-test app/src/main/java/com/aurel/hires/AurelFocusPolicy.java tests/AurelFocusPolicyTest.java
          java -cp build/audio-focus-test com.aurel.hires.AurelFocusPolicyTest
      - name: Verify Android WebView scroll and bounded MediaPlayer recovery
        run: node tests/webview-scroll-media-recovery.test.cjs
      - name: Verify low-level Android audio error recovery budget and seek policy
        run: |
          mkdir -p build/media-recovery-test
          javac -d build/media-recovery-test app/src/main/java/com/aurel/hires/AurelMediaRecoveryPolicy.java tests/AurelMediaRecoveryPolicyTest.java
          java -cp build/media-recovery-test com.aurel.hires.AurelMediaRecoveryPolicyTest
      - name: Verify signed in-app updater safeguards
        run: node tests/updates.test.cjs
      - name: Verify actual FLAC and MP3 stream header parsing
        run: |
          mkdir -p build/probe-check
          javac -d build/probe-check app/src/main/java/com/aurel/hires/StreamQualityProbe.java tests/StreamQualityProbeTest.java
          java -cp build/probe-check com.aurel.hires.StreamQualityProbeTest
      - name: Test production signing wiring with disposable CI key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurel-ci-signing"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/aurel-ci-signing/throwaway-ci-only.p12" \
            -storetype PKCS12 -alias aurel-release -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CI Signing Test, O=Temporary, C=US" \
            -storepass "ci-temporary-signing-only" -keypass "ci-temporary-signing-only"
          AUREL_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/aurel-ci-signing/throwaway-ci-only.p12" \
            AUREL_RELEASE_PASSWORD="ci-temporary-signing-only" \
            gradle --no-daemon :app:assembleRelease --rerun-tasks
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
          # This APK has an ephemeral CI test key and is NEVER published.
          rm -f app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/aurel-ci-signing/throwaway-ci-only.p12"
      - name: Assemble isolated Preview APK
        run: |
          gradle --no-daemon :app:assembleDebug -PaurelPreview --rerun-tasks
          mkdir -p app/build/safe-preview
          cp app/build/outputs/apk/debug/app-debug.apk app/build/safe-preview/AurelHiRes-preview-debug.apk
      - name: Assemble standard debug APK
        run: gradle --no-daemon :app:assembleDebug --rerun-tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AurelHiRes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AurelHiRes-preview-apk
          path: app/build/safe-preview/AurelHiRes-preview-debug.apk
          if-no-files-found: warn
