name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate all player scripts
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Verify player UI and source metadata
        run: node test_ui.cjs
      - name: Assemble isolated Preview APK
        run: |
          gradle --no-daemon :app:assembleDebug -PaurelPreview --rerun-tasks
          mkdir -p app/build/safe-preview
          cp app/build/outputs/apk/debug/app-debug.apk app/build/safe-preview/AurelHiRes-preview-debug.apk
      - name: Assemble standard debug APK
        run: gradle --no-daemon :app:assembleDebug --rerun-tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AurelHiRes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AurelHiRes-preview-apk
          path: app/build/safe-preview/AurelHiRes-preview-debug.apk
          if-no-files-found: warn
