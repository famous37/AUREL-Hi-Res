name: Qobuz MOD token login v4 verified baseline build
on:
  push:
    branches: [qobuz-mod-10-2-token-auth]
    paths: ['qobuz-mod/**', '.github/workflows/qobuz-mod-analysis.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-original:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Qobuz TokenLogin v3 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download 44500411161 --repo famous37/AUREL-Hi-Res \
            --name Qobuz-10.2.0.0-token-login-v3-EXPERIMENTAL --dir baseline
          cp baseline/Qobuz-10.2.0.0-TokenLogin-v3-EXPERIMENTAL.apk original.apk
          echo 'f949ce3cc8957fc3e016cf122fda5b5b513e626d191d83a81996cde877f64f55  original.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile("original.apk") as z:
              names=z.namelist()
              assert all("classes"+(str(i) if i>1 else "")+".dex" in names for i in range(1,6))
              assert "AndroidManifest.xml" in names
          open("qobuz-auth-analysis.json","w").write(json.dumps({
              "baseline":"verified 10.2.0.0 TokenLogin v3",
              "sha256":"f949ce3cc8957fc3e016cf122fda5b5b513e626d191d83a81996cde877f64f55",
              "classes_dex":5,
              "warning":"Original Qobuz OAuth/QWS session is still required for native playback"
          },indent=2))
          print("Verified v3 baseline with five DEX files")
          PY
      - name: Audit original Qobuz OAuth and QWS integration (read-only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o apktool.jar
          java -jar apktool.jar d -f -r original.apk -o decoded >/dev/null
          python3 qobuz-mod/tools/audit_native_auth.py decoded > qobuz-native-auth-audit.txt
          echo 'Native auth audit complete; no tokens read'
          sed -n '1,90p' qobuz-native-auth-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qobuz-native-auth-audit
          path: qobuz-native-auth-audit.txt
          retention-days: 7
      - name: Patch token panel, rebuild and sign experimental Qobuz package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qobuz-mod/generated/com/qobuz/mod build/modclasses build/moddex
          cp qobuz-mod/src/TokenGate.java qobuz-mod/generated/com/qobuz/mod/TokenGate.java
          ANDROID_JAR="$(find "${ANDROID_HOME}/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          javac -source 8 -target 8 -cp "${ANDROID_JAR}" -d build/modclasses qobuz-mod/generated/com/qobuz/mod/TokenGate.java
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "${SDK_BUILD_TOOLS}/d8" --min-api 23 --lib "${ANDROID_JAR}" --output build/moddex $(find build/modclasses -name '*.class')
          test -f build/moddex/classes.dex
          python3 - <<'PY'
          data=open("build/moddex/classes.dex","rb").read()
          assert b"TokenGate" in data, "TokenGate class missing"
          assert "УВІЙТИ".encode("utf-8") in data, "Token login button label missing"
          assert b"fetchFavoriteList" in data, "Authenticated library code missing"
          assert "Поміняти USER ID".encode("utf-8") in data, "Swap IDs button missing"
          print("Verified token login UI + Qobuz API library in compiled DEX")
          PY
          cp original.apk repack-unsigned.apk
          zip -q -d repack-unsigned.apk classes5.dex
          cp build/moddex/classes.dex classes5.dex
          zip -q repack-unsigned.apk classes5.dex
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -x "${SDK_BUILD_TOOLS}/zipalign"
          test -x "${SDK_BUILD_TOOLS}/apksigner"
          "${SDK_BUILD_TOOLS}/zipalign" -f -p 4 repack-unsigned.apk repack-aligned.apk
          keytool -genkeypair -alias modsmoke -keyalg RSA -keysize 2048 \
            -keystore /tmp/modsmoke.jks -storepass android -keypass android -dname "CN=Smoke Test" -validity 1 -noprompt >/dev/null 2>&1
          "${SDK_BUILD_TOOLS}/apksigner" sign --ks /tmp/modsmoke.jks \
            --ks-key-alias modsmoke --ks-pass pass:android --key-pass pass:android \
            --out repack-smoke.apk repack-aligned.apk
          "${SDK_BUILD_TOOLS}/apksigner" verify --verbose repack-smoke.apk > repack-smoke-report.txt
          echo 'Replaced only experimental classes5.dex in verified v3 original-Qobuz-based package; OAuth/QWS remains unchanged.' >> repack-smoke-report.txt
          echo 'Token login v4 adds USER ID / APP ID swap and HTTP 400 guidance; original OAuth/QWS is unchanged.' >> repack-smoke-report.txt
          cp repack-smoke.apk Qobuz-10.2.0.0-TokenLogin-v4-EXPERIMENTAL.apk
          rm -f repack-smoke.apk repack-unsigned.apk repack-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qobuz-mod-experimental-build-report
          path: repack-smoke-report.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Qobuz-10.2.0.0-token-login-v4-EXPERIMENTAL
          path: Qobuz-10.2.0.0-TokenLogin-v4-EXPERIMENTAL.apk
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: qobuz-mod-readonly-analysis
          path: qobuz-auth-analysis.json
          retention-days: 7
