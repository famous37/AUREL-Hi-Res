name: One-time cleanup — older AUREL GitHub Releases
# One-time, explicit cleanup of the 70 historical releases present at creation.
# Do not delete v1.1.85, Git tags, Git branches or source commits.
on:
  push:
    branches: [release/stable-content-auto-updates-v1.1.85]
    paths:
      - .github/workflows/aurel-one-time-release-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/release/stable-content-auto-updates-v1.1.85' && contains(github.event.head_commit.message, '[cleanup-aurel-before-v1.1.85]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify protected release and remove only enumerated historical releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if [[ "$repo" != "famous37/AUREL-Hi-Res" ]]; then
            echo "::error::Unexpected repository"; exit 1
          fi
          actual="$(gh api "repos/$repo/releases/451731430" --jq '.tag_name')"
          if [[ "$actual" != "v1.1.85" ]]; then
            echo "::error::Protected v1.1.85 release missing or renamed"; exit 1
          fi
          removed=0; skipped=0
          while IFS='|' read -r id expected_tag; do
            [[ -n "$id" ]] || continue
            [[ "$id" != "451731430" ]] || { echo "::error::Protected release in deletion list"; exit 1; }
            tag="$(gh api "repos/$repo/releases/$id" --jq '.tag_name' 2>/dev/null)" || {
              echo "Release ID $id no longer exists; skipping"; skipped=$((skipped+1)); continue
            }
            if [[ "$tag" != "$expected_tag" ]]; then
              echo "::error::ID $id now has tag $tag, expected $expected_tag; aborting"; exit 1
            fi
            gh api --method DELETE "repos/$repo/releases/$id" >/dev/null
            removed=$((removed+1))
            echo "Removed historical release: $tag ($id)"
          done <<'HISTORICAL_RELEASE_IDS'
          451280342|v1.1.82
          451264726|v1.1.81
          451240203|v1.1.80
          450989383|v1.1.79
          450972985|v1.1.78
          450848613|v1.1.77
          450832057|v1.1.76
          450812601|v1.1.75
          450562309|v1.1.74
          450511948|v1.1.73
          450471145|v1.1.72
          450445003|v1.1.71
          450395277|v1.1.70
          450357749|v1.1.69
          450325844|v1.1.68
          450292518|v1.1.67
          450261343|v1.1.66
          450229831|v1.1.65
          450194899|v1.1.64
          450178493|v1.1.63
          450130768|v1.1.62
          450060689|v1.1.61
          450036293|v1.1.60
          450015485|v1.1.59
          449949751|v1.1.58
          449920460|v1.1.57
          449821286|v1.1.56
          449798564|v1.1.55
          449767202|v1.1.54
          449746566|v1.1.53
          449609497|v1.1.52
          449582366|v1.1.51
          449172209|v1.1.50
          449155974|v1.1.49
          449133043|v1.1.48
          449097852|v1.1.47
          449074902|v1.1.46
          449041479|v1.1.45
          449013799|v1.1.44
          448878296|v1.1.43
          448834659|v1.1.42
          448670138|v1.1.41
          448632105|v1.1.40
          448613181|v1.1.39
          448583150|v1.1.38
          448559105|v1.1.37
          448509787|v1.1.36
          448494750|v1.1.35
          448467920|v1.1.34
          448443580|v1.1.33
          448421985|v1.1.32
          448391798|v1.1.31
          448377925|v1.1.30
          448356174|v1.1.29
          448341154|v1.1.28
          448328919|v1.1.27
          447604047|v1.1.26
          447568703|v1.1.25
          447553929|v1.1.24
          447531778|v1.1.23
          447482337|v1.1.22
          447453905|v1.1.21
          447427880|v1.1.20
          447404370|v1.1.19
          447327807|v1.1.18
          447057341|v1.1.13
          447039199|v1.1.12
          447031674|v1.1.11
          446339446|v0.4.0-alpha
          446309335|v0.2.0-alpha
          HISTORICAL_RELEASE_IDS
          # A GitHub release is not a Git tag. Preserve all existing tags/commits.
          remaining="$(gh api "repos/$repo/releases?per_page=100" --jq '[.[].tag_name] | join(", ")')"
          echo "Removed $removed releases; skipped $skipped previously missing."
          echo "Remaining release tags: $remaining"
          if [[ "$remaining" != "v1.1.85" ]]; then
            echo "::error::Unexpected releases remain. Check manually."; exit 1
          fi
          echo "### AUREL GitHub Release cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "Removed: $removed; missing: $skipped; protected: v1.1.85." >> "$GITHUB_STEP_SUMMARY"
          echo "Git tags, branches, commits, and the signed v1.1.85 APK were preserved." >> "$GITHUB_STEP_SUMMARY"
