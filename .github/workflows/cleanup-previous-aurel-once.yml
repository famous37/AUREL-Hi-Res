name: One-time remove obsolete signed AUREL release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-previous-aurel-once.yml'
permissions:
  contents: write
jobs:
  remove-old:
    if: github.repository == 'famous37/AUREL-Hi-Res'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep v1.1.94 and remove only old v1.1.93 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          [[ "${latest}" == 'v1.1.94' ]] || { echo "::error::Unexpected latest release ${latest}"; exit 1; }
          old="$(gh api "repos/${GH_REPO}/releases/452419824" --jq .tag_name)"
          [[ "${old}" == 'v1.1.93' ]] || { echo "::error::Unexpected obsolete release ${old}"; exit 1; }
          gh api --method DELETE "repos/${GH_REPO}/releases/452419824"
          [[ "$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)" == 'v1.1.94' ]]
          echo 'v1.1.93 release deleted; Git tag retained; v1.1.94 remains available.'
