name: Publish AUREL Hi-Res current release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check player UI before publication
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node test_ui.cjs
      - name: Test artist-to-album Back navigation and artwork
        run: node tests/navigation.test.cjs
      - name: Verify FLAC and MP3 header parsing
        run: |
          mkdir -p build/probe-check
          javac -d build/probe-check app/src/main/java/com/aurel/hires/StreamQualityProbe.java tests/StreamQualityProbeTest.java
          java -cp build/probe-check com.aurel.hires.StreamQualityProbeTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG=v1.1.18
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#AUREL-Hi-Res-v1.1.18.apk" --clobber
          else
            gh release create "$TAG" "$APK#AUREL-Hi-Res-v1.1.18.apk" \
              --target "$GITHUB_SHA" \
              --title "AUREL Hi-Res v1.1.18" \
              --notes "**AUREL Hi-Res v1.1.18 — compact floating notifications**

Changes:
- Fixed oversized error notifications: the top floating message now fits its text and controls rather than stretching down the player.
- Alerts remain below the status bar and long messages remain scrollable.
- Retains the artist → album → player Back history, scroll restoration, library caching and reduced list thumbnail sizes from v1.1.17.
- Retains the existing audio playback and track-quality reporting.

Verified: GitHub Actions checks for JavaScript, player UI, navigation regression, FLAC/MP3 header parsing, and Android build.

Known limitation: HTTP 404 returned by the Mornye/Zarz gateway is upstream and is not changed by this UI fix.

Install note: This is a debug-signed prerelease APK. Back up app data before replacing an installation signed with a different certificate." \
              --prerelease
          fi
