name: Publish AUREL Hi-Res alpha release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG=v0.4.0-alpha
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#AUREL-Hi-Res-v0.4.0-alpha-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#AUREL-Hi-Res-v0.4.0-alpha-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "AUREL Hi-Res v0.4.0 Alpha" \
              --notes "AUREL Hi-Res v0.4 audiophile alpha by famous37: revamped high-contrast artwork-first player, source audio metadata with verified sample-rate conversion, no equalizer, custom launcher icon, purchased-track/album/artist downloads when authorized by Qobuz, and local purchased-file playback. Direct HTTPS audio only; encrypted segmented streams unsupported. Qobuz login and downloads require real account validation. Unofficial independent application, not affiliated with Qobuz." \
              --prerelease
          fi
