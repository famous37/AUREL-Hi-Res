name: Publish AUREL Hi-Res current release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check player UI before publication
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node test_ui.cjs
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG=v1.1.11
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#AUREL-Hi-Res-v1.1.11.apk" --clobber
          else
            gh release create "$TAG" "$APK#AUREL-Hi-Res-v1.1.11.apk" \
              --target "$GITHUB_SHA" \
              --title "AUREL Hi-Res v1.1.11" \
              --notes "AUREL Hi-Res v1.1.11: artwork dynamically fits the available Android screen height, responsive portrait and landscape layouts, preserved five-tab navigation, adaptive cover sizing and accessible playback controls. Album palette, Qobuz streaming and source-quality reporting remain unchanged. Independent unofficial app." \
              --prerelease
          fi
