name: Publish permanently signed AUREL release
# v1.1.86: transactional library transfer, safe JSON import/export and existing audio preserved.
# Preserve USB bit-perfect, navigation, layouts, preferences and permanent signing.

# Release signing always requires private GitHub Actions Secrets.
# Push triggers here only when the release workflow itself changes; other
# source commits run the ordinary test build, never an unsigned release.
on:
  workflow_dispatch:
  push:
    branches: [feature/library-transfer-manager-v1.1.86]
    paths: ['.github/workflows/release.yml', 'app/build.gradle']

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/library-transfer-manager-v1.1.86'
    runs-on: ubuntu-latest
    env:
      AUREL_RELEASE_PASSWORD: ${{ secrets.AUREL_RELEASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required signing secrets (fail closed)
        env:
          AUREL_RELEASE_KEYSTORE_BASE64: ${{ secrets.AUREL_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUREL_RELEASE_KEYSTORE_BASE64:-}" || -z "${AUREL_RELEASE_PASSWORD:-}" ]]; then
            echo "::error::Missing signing secrets. Configure AUREL_RELEASE_KEYSTORE_BASE64 and AUREL_RELEASE_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          AUREL_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/aurel-signing/aurel-release.keystore"
          echo "AUREL_RELEASE_KEYSTORE_PATH=$AUREL_RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$AUREL_RELEASE_KEYSTORE_PATH")"
          umask 077
          printf '%s' "$AUREL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$AUREL_RELEASE_KEYSTORE_PATH"
          chmod 600 "$AUREL_RELEASE_KEYSTORE_PATH"
          # Check that the developer-owned key has not been accidentally replaced.
          ACTUAL_CERT="$(keytool -exportcert -rfc \
            -keystore "$AUREL_RELEASE_KEYSTORE_PATH" \
            -storepass "$AUREL_RELEASE_PASSWORD" \
            -alias aurel-release | openssl x509 -noout -fingerprint -sha256 | \
            sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="C9F57989C6622A55440F35CD426A5DC6830161EEB5AEAB299FDB3E69F94ED3CA"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Signing certificate mismatch. Refusing to build an incompatible AUREL update."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Validate release version and prevent replacing signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep 'versionName ' app/build.gradle | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | tail -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Could not identify an unambiguous AUREL release version."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Increase versionCode and versionName; never overwrite an existing signed release."
            exit 1
          fi
          echo "AUREL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AUREL_TAG=v$VERSION" >> "$GITHUB_ENV"

      # The native restartAnalyzer request maps to Java resetAnalyzer;
      # the FFT integration regression checks that exact contract.
      # Glass cascade must be the final CSS layer, yet must never alter
      # geometry of the tested landscape navbar or cover artwork.
      # Keep route/detail animation assertions aligned with deliberate 215ms,
      # near-opaque compositor fades. Never weaken the no-rerender guards.
      - name: Check JavaScript, navigation, and audio format tests
        shell: bash
        run: |
          set -euo pipefail
          for script in app/src/main/assets/*.js; do node --check "$script"; done
          node test_ui.cjs
          node tests/account-language.test.cjs
          node tests/favourites-theme.test.cjs
          node tests/share.test.cjs
          node tests/smooth-motion.test.cjs
          node tests/release-availability.test.cjs
          # Release status CSS loads after motion styles without replacing them.
          # Availability assertions reference the actual access-status variable.
          # Share styles load last; existing graphite and favourite assets remain enabled.
          # Favourite mutation/rollback, status loading, and session separation are validated above.
          # DOM mock includes classList.contains, matching Android WebView's Element API.
          node tests/navigation.test.cjs
          node tests/updates.test.cjs
          node tests/minimal-player.test.cjs
          node tests/bit-perfect.test.cjs
          node tests/usb-volume-recovery.test.cjs
          node tests/usb-bitperfect-recovery.test.cjs
          node tests/playback-continuity.test.cjs
          node tests/swipe-icons.test.cjs
          node tests/player-icon-seek.test.cjs
          node tests/ui-bold-loading.test.cjs
          node tests/landscape-layout.test.cjs
          node tests/landscape-nav-safe.test.cjs
          node tests/cover-rhythm.test.cjs
          node tests/cover-rhythm-runtime.test.cjs
          node tests/aurora-glow.test.cjs
          node tests/aurora-glow-runtime.test.cjs
          node tests/borderless-player.test.cjs
          node tests/universal-borderless-theme.test.cjs
          node tests/fft-ambient-theme-recovery.test.cjs
          node tests/error-log.test.cjs
          node tests/fluid-windows.test.cjs
          node tests/global-polish.test.cjs
          node tests/precise-ui.test.cjs
          node tests/pro-audio-page-cache.test.cjs
          node tests/bluetooth-settings.test.cjs
          node tests/clarity-uk-icon.test.cjs
          node tests/media-ui-unification.test.cjs
          node tests/settings-contrast-uk.test.cjs
          node tests/artist-biography-mono.test.cjs
          node tests/settings-state-motion.test.cjs
          node tests/player-scroll-focus.test.cjs
          node tests/webview-scroll-media-recovery.test.cjs
          node tests/output-loss-glass-immersive.test.cjs
          node tests/immersive-theme-log.test.cjs
          node tests/floating-header-fft-recovery.test.cjs
          node tests/player-gestures-polish-uk.test.cjs
          node tests/player-dom-stability.test.cjs
          node tests/fullscreen-continuous-canvas.test.cjs
          node tests/global-glass-v1.1.78.test.cjs
          node tests/player-reopen-stability.test.cjs
          node tests/artist-catalog-progress.test.cjs
          node tests/qobuz-appid-media-diagnostics.test.cjs
          node tests/discover-source-priority.test.cjs
          # All regressions, including Stage 1+2 and stable catalogue/update tests.
          for test in tests/*.test.cjs; do node "$test"; done
          mkdir -p build/media-recovery-test
          javac -d build/media-recovery-test app/src/main/java/com/aurel/hires/AurelMediaRecoveryPolicy.java tests/AurelMediaRecoveryPolicyTest.java
          java -cp build/media-recovery-test com.aurel.hires.AurelMediaRecoveryPolicyTest
          mkdir -p build/audio-focus-test
          javac -d build/audio-focus-test app/src/main/java/com/aurel/hires/AurelFocusPolicy.java tests/AurelFocusPolicyTest.java
          java -cp build/audio-focus-test com.aurel.hires.AurelFocusPolicyTest
          mkdir -p build/unplug-policy-test
          javac -d build/unplug-policy-test app/src/main/java/com/aurel/hires/AurelUnplugPolicy.java tests/AurelUnplugPolicyTest.java
          java -cp build/unplug-policy-test com.aurel.hires.AurelUnplugPolicyTest
          mkdir -p build/beat-check
          javac -d build/beat-check app/src/main/java/com/aurel/hires/AurelBeatEnvelope.java tests/AurelBeatEnvelopeTest.java
          java -cp build/beat-check com.aurel.hires.AurelBeatEnvelopeTest
          mkdir -p build/probe-check
          javac -d build/probe-check app/src/main/java/com/aurel/hires/StreamQualityProbe.java tests/StreamQualityProbeTest.java
          java -cp build/probe-check com.aurel.hires.StreamQualityProbeTest

      - name: Build production-signed APK (not a debug APK)
        shell: bash
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature, certificate identity, and package ID
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          ACTUAL_CERT="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | \
            head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="C9F57989C6622A55440F35CD426A5DC6830161EEB5AEAB299FDB3E69F94ED3CA"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::APK is not signed by the permanent AUREL release certificate."
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | \
            grep -q "package: name='com.aurel.hires'"
          mkdir -p build/signed-artifacts
          cp "$APK" "build/signed-artifacts/AUREL-Hi-Res-v${AUREL_VERSION}.apk"
          (
            cd build/signed-artifacts
            sha256sum "AUREL-Hi-Res-v${AUREL_VERSION}.apk" > SHA256SUMS.txt
          )
          echo "Signature and package verified."

      - name: Publish permanently signed stable AUREL update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "**AUREL Hi-Res v${AUREL_VERSION} — Library Import / Export Manager" \
            '' \
            '- Transfer authorised Qobuz artists, albums, tracks and playlists into an independent local metadata library.' \
            '- Explicit source account and collection selection, bounded pages, progress and cancellation. On failure the previous local library remains intact.' \
            '- Import/export local JSON using Android document picker, strict field/version validation, deduplication, transactional storage and safe merge/replace.' \
            '- Read-only local playlist and favourites browser; no changes to Qobuz-managed favourites or playlists.' \
            '- No passwords, account tokens, App Secrets, streaming URLs or audio content are exported.' \
            '- All Stage 1/2 performance, synced LRCLIB lyrics, Qobuz browsing and existing UI preferences remain available.' \
            '- Native audio player, USB output and existing account authentication are unchanged.' \
            '- In-app auto-update check remains enabled with user-approved APK installation.' \
            '- Android versionCode 103, versionName 1.1.86, signed by the original AUREL release certificate.' \
            '' \
            "Install v${AUREL_VERSION} over the existing permanently signed AUREL 1.1.85 without uninstalling or clearing app data." \
            'Signing certificate SHA-256: C9F57989C6622A55440F35CD426A5DC6830161EEB5AEAB299FDB3E69F94ED3CA' > build/signed-artifacts/release-notes.md
          gh release create "$AUREL_TAG" \
            "build/signed-artifacts/AUREL-Hi-Res-v${AUREL_VERSION}.apk" \
            "build/signed-artifacts/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "AUREL Hi-Res v${AUREL_VERSION}" \
            --notes-file build/signed-artifacts/release-notes.md 
          gh release view "$AUREL_TAG" --json tagName,url,assets --jq '.tagName + " " + .url + " " + ([.assets[].name] | join(", "))'

      - name: Keep the verified signed APK as a CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurelHiRes-permanently-signed-release-apk
          path: build/signed-artifacts/AUREL-Hi-Res-v*.apk
          if-no-files-found: error
