name: Build Papple Music Android APK
on:
  push:
    branches:
      - build/papple-android-20261121
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload transferred source for integrity check
        uses: actions/upload-artifact@v4
        with:
          name: transferred-source
          path: build-source.zip
      - name: Check and extract Android sources
        run: |
          unzip -t build-source.zip
          unzip -q build-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PappleMusic-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
