name: Build Papple Music Android APK
on:
  push:
    branches:
      - build/papple-android-20261121
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Recover transferred archive and verify integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          archive = Path("build-source.zip")
          submitted = base64.b64encode(archive.read_bytes()).decode("ascii")
          restored = submitted[:6554] + "+" + submitted[6554:-1]
          archive.write_bytes(base64.b64decode(restored, validate=True))
          PY
          echo "74943c4834dfafb95a76541cc9e1babab5516c0bfe6f0bfc279c5fa400168cdb  build-source.zip" | sha256sum --check
          unzip -t build-source.zip
          unzip -q build-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PappleMusic-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
