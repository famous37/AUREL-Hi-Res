pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'AurelHiRes'
include ':app'
// MIT userspace UAC2 driver. Run scripts/setup-usb-driver.sh before building.
['decent-usb-audio-driver','decent-usb-audio-wrapper-media3','decent-media3-decoder-flac'].each { name ->
  include ":${name}"
  project(":${name}").projectDir = file("vendor/decent-player/libs/${name}")
}
