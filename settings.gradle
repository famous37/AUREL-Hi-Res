pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }
rootProject.name = 'AurelHiRes'

// A distinct, private-only experimental application. Compiling it does not
// configure the production AUREL app or load its existing USB driver.
if (providers.gradleProperty('aurelSuperpoweredLab').isPresent()) {
    include ':superpoweredUsbLab'
} else {
    include ':app'
    // Keep the production native FLAC decoder and unchanged CI build.
    include ':decent-media3-decoder-flac'
    project(':decent-media3-decoder-flac').projectDir =
        file('vendor/decent-player/libs/decent-media3-decoder-flac')
}
